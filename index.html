<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01050c">
  <title>螺旋光芒</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #071728 0%, #020812 56%, #010309 100%);
    }
    body {
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .stage {
      position: relative;
      width: min(100vw, 177.778vh);
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      overflow: hidden;
      background: #020711;
      box-shadow: 0 0 80px rgba(38, 142, 201, .18);
    }
    .video-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 125%;
      height: 100%;
      object-fit: fill;
      transform: translate(-50%, -50%);
      filter: contrast(1.04) saturate(1.06);
    }
    .hint {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.9);
      border: 0;
      color: white;
      font: 600 15px/1.4 system-ui, sans-serif;
      background: rgba(2,8,18,.38);
      z-index: 3;
      cursor: pointer;
    }
    .hint[hidden] { display: none; }
    .play-pill {
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: rgba(2,12,25,.66);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="蓝金色螺旋光芒动态作品">
    <video id="video" class="video-layer" autoplay muted playsinline webkit-playsinline preload="auto" poster="spiral-light.jpg">
      <source src="spiral-light.mp4" type="video/mp4">
    </video>
    <button id="hint" class="hint" type="button" aria-label="开始播放">
      <span class="play-pill">▶ 轻触播放</span>
    </button>
  </main>

  <script>
    const START = 3.65;
    const END = 6.15;
    const video = document.getElementById('video');
    const hint = document.getElementById('hint');

    function resetPosition() {
      if (video.duration && (video.currentTime < START || video.currentTime >= END)) {
        video.currentTime = START;
      }
    }

    async function start() {
      video.muted = true;
      resetPosition();
      try {
        await video.play();
        hint.hidden = true;
      } catch {
        hint.hidden = false;
      }
    }

    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= END) {
        video.currentTime = START;
        video.play().catch(() => { hint.hidden = false; });
      }
    });
    video.addEventListener('loadedmetadata', () => { video.currentTime = START; start(); }, { once: true });
    video.addEventListener('canplay', start, { once: true });
    video.addEventListener('playing', () => { hint.hidden = true; });
    video.addEventListener('error', () => {
      hint.hidden = false;
      hint.querySelector('.play-pill').textContent = '点击重新加载';
    });
    hint.addEventListener('click', () => {
      video.load();
      video.addEventListener('canplay', start, { once: true });
      start();
    });
    if (video.readyState >= 1) start();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) start();
    });
  </script>
</body>
</html>
