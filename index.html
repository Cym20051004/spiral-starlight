<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01050c">
  <title>螺旋光芒</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #071728 0%, #020812 56%, #010309 100%);
    }
    body {
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .stage {
      position: relative;
      width: min(100vw, 177.778vh);
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      overflow: hidden;
      background: #020711;
      box-shadow: 0 0 80px rgba(38, 142, 201, .18);
    }
    .video-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 125%;
      height: 100%;
      object-fit: fill;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity .72s linear;
      will-change: opacity;
      filter: contrast(1.04) saturate(1.06);
    }
    .video-layer.visible { opacity: 1; }
    .hint {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: rgba(255,255,255,.9);
      font: 14px/1.4 system-ui, sans-serif;
      background: rgba(2,8,18,.42);
      z-index: 3;
    }
    .hint.show { display: grid; }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="蓝金色螺旋光芒动态作品">
    <video id="videoA" class="video-layer" autoplay muted playsinline webkit-playsinline preload="auto">
      <source src="spiral-light.mp4" type="video/mp4">
    </video>
    <video id="videoB" class="video-layer" muted playsinline webkit-playsinline preload="auto">
      <source src="spiral-light.mp4" type="video/mp4">
    </video>
    <div id="hint" class="hint">轻触画面开始播放</div>
  </main>

  <script>
    const START = 2.85;
    const END = 6.15;
    const FADE = .72;
    const videos = [document.getElementById('videoA'), document.getElementById('videoB')];
    const stage = document.getElementById('stage');
    const hint = document.getElementById('hint');
    let active = 0;
    let switching = false;
    let started = false;

    async function playVideo(video) {
      video.muted = true;
      try {
        await video.play();
        hint.classList.remove('show');
        return true;
      } catch {
        hint.classList.add('show');
        return false;
      }
    }

    async function start() {
      if (started) return;
      started = true;
      videos[0].currentTime = START;
      videos[0].classList.add('visible');
      if (!await playVideo(videos[0])) started = false;
      requestAnimationFrame(loop);
    }

    function loop() {
      const current = videos[active];
      if (!switching && current.currentTime >= END - FADE) {
        switching = true;
        const nextIndex = active ? 0 : 1;
        const next = videos[nextIndex];
        next.currentTime = START;
        playVideo(next);
        next.classList.add('visible');
        setTimeout(() => {
          current.classList.remove('visible');
          current.pause();
          current.currentTime = START;
          active = nextIndex;
          switching = false;
        }, FADE * 1000);
      }
      requestAnimationFrame(loop);
    }

    videos[0].addEventListener('loadedmetadata', start, { once: true });
    if (videos[0].readyState >= 1) start();
    stage.addEventListener('click', () => {
      started = false;
      start();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) playVideo(videos[active]);
    });
  </script>
</body>
</html>
